# fly.toml for (un)known, app un-known
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'un-known'
primary_region = 'ams'

[build]
[env]
  PORT = '3010'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 3010
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
