<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report · (un)known</title><link rel="stylesheet" href="/static/style.css"><link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><path d="M4 16s5-7 12-7 12 7 12 7-5 7-12 7S4 16 4 16z" fill="none" stroke="%23111" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="3.5" fill="%23111" stroke="%23111" stroke-width="2"/></svg>' media="(prefers-color-scheme: light)"><link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><path d="M4 16s5-7 12-7 12 7 12 7-5 7-12 7S4 16 4 16z" fill="none" stroke="%23ecece6" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="3.5" fill="%23ecece6" stroke="%23ecece6" stroke-width="2"/></svg>' media="(prefers-color-scheme: dark)"><script src="/static/theme.js"></script></head>
<body><button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">◐</button><main>
<div class="page-nav">
  <a class="small" id="back" href="#">← round</a>
  <span class="brandmark"><a class="brand" href="/">(un)known</a><span class="by">powered by <a href="https://www.orbio.so/?ref=3e194c38c29748e794673f3f81d2a850" target="_blank" rel="noopener">Orbio</a></span></span>
</div>

<h1 id="pname"><span class="skel lg"></span></h1>
<p class="sub" id="line"><span id="linetext"><span class="skel sm"></span></span> · <a href="#" id="copyroundlink" class="muted">Copy round link</a></p>

<div class="card prompt-card" style="margin-bottom:28px">
  <p class="small muted" id="copyhelp" style="margin:0">Paste into the AI that already knows your product. It will turn this into How Might We questions and a few small things to try next.</p>
  <div class="row"><button id="copyai" disabled>Copy for your AI</button></div>
  <details class="fold quiet">
    <summary>View prompt</summary>
    <pre id="aiprompt" class="mono small" style="white-space:pre-wrap;margin-top:10px">Waiting for the round report…</pre>
  </details>
</div>

<div id="syn"><div class="skel-card tall"></div></div>

<h2>Sessions</h2>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s);const rid=location.pathname.split('/')[2];
const KEY=new URLSearchParams(location.search).get('key')||'';
const api=p=>p+(p.includes('?')?'&':'?')+'key='+KEY;
$('#back').href='/round/'+rid+'?key='+KEY;
const roundUrl=location.origin+'/round/'+rid+'?key='+KEY;
$('#copyroundlink').onclick=async(e)=>{e.preventDefault();try{await navigator.clipboard.writeText(roundUrl);$('#copyroundlink').textContent='Copied';setTimeout(()=>$('#copyroundlink').textContent='Copy round link',1500)}catch{}};
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let PACK=null;
function buildPaste(R, syn){
  const B=R.brief||{};
  const n=(R.sessions||[]).filter(s=>s.done_at).length;
  const learn=(B.unknowns||[]).map((u,i)=>`${i+1}. ${u.q||''}`).join('\n');
  const takes=(syn.takeaways||[]).map(t=>`- ${t}`).join('\n')||'- (none)';
  return `I'm the founder of ${B.project||R.project} (${B.one_line||''}).
I just ran short user interviews through (un)known. Below is the round synthesis, not raw transcripts.

Do this:
1. Write 5 How Might We questions grounded only in what showed up below. Concrete to this product. No generic UX HMWs.
   Each HMW should name a real tension or unmet need (problem-focused), assume a good answer exists (optimistic), and stay open, with no UI control, feature, or solution baked into the question. Save the solution for the bets.
2. Then 3 small next bets I could ship or test in a week. Each one sentence. Tied to a takeaway or the "if true, change" line. These can name a concrete move; the HMWs should not.
3. Call out anything below that is still too thin to act on.

Don't restate the takeaways as bullet praise. Don't invent users or quotes I didn't give you.

---
WHAT WE SET OUT TO LEARN
${learn||'(none)'}

AFTER ${n} SESSION${n===1?'':'S'}

Takeaways
${takes}

If this is true, change
${syn.change_if_true||'(none)'}

Where they disagree / still thin
${syn.disagree_or_thin||'(none)'}
---`;
}
function setCopyReady(on){
  const b=$('#copyai');
  b.disabled=!on;
  b.textContent='Copy for your AI';
}
$('#copyai').onclick=async()=>{
  if(!PACK)return;
  try{
    await navigator.clipboard.writeText(PACK);
    $('#copyai').textContent='Copied';
    setTimeout(()=>{$('#copyai').textContent='Copy for your AI'},1500);
  }catch{alert('Could not copy.');}
};
function paintSyn(syn, waiting){
  const box=$('#syn');
  if(waiting){
    box.innerHTML=`<h2>Round takeaways</h2><div class="card muted small"><span class="wait-dots" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>Writing the round report…</div>`;
    setCopyReady(false);
    return;
  }
  if(!syn){box.innerHTML='';setCopyReady(false);return}
  const takes=(syn.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('');
  box.innerHTML=`
<h2>Takeaways</h2>
<div class="card takeaways"><ol>${takes||'<li class="muted">None yet.</li>'}</ol></div>
${syn.change_if_true?`<h2>If this is true, change</h2><div class="change">${esc(syn.change_if_true)}</div>`:''}
${syn.disagree_or_thin?`<h2>Where they disagree / still thin</h2><div class="card">${esc(syn.disagree_or_thin)}</div>`:''}
`;
}
async function load(){
  const R=await fetch(api('/api/rounds/'+rid)).then(r=>r.json());
  if(R.error){document.querySelector('main').innerHTML='<h1>(un)known</h1><p class="sub">'+(R.error==='unauthorized'?'This link needs a key.':'Round not found.')+'</p><p class="small muted" style="margin-top:20px"><a href="/">&#8592; start over</a></p>';return}
  $('#pname').textContent=R.project;
  const done=R.sessions.filter(s=>s.done_at);
  $('#linetext').textContent=done.length?`Report · after ${done.length} session${done.length===1?'':'s'}`:'Report · no finished sessions yet';
  const out=$('#out');out.innerHTML='';
  PACK=null;setCopyReady(false);
  if(!done.length){
    paintSyn(null);
    $('#aiprompt').textContent='Waiting for the round report…';
    out.innerHTML='<div class="card muted small">Nothing to report yet. Send the invite link.</div>';
    return;
  }
  let syn=R.synthesis;
  if(R.synthesis_stale||!syn){
    if(syn) paintSyn(syn); else paintSyn(null,true);
    try{
      const res=await fetch(api('/api/rounds/'+rid+'/synthesis'),{method:'POST'});
      const j=await res.json().catch(()=>({error:'Synthesis failed.'}));
      if(res.ok&&!j.error) syn=j;
      else paintSyn(null);
    }catch{paintSyn(null)}
  }
  if(syn){
    paintSyn(syn);
    PACK=buildPaste(R, syn);
    $('#aiprompt').textContent=PACK;
    setCopyReady(true);
  }else{
    $('#aiprompt').textContent='Waiting for the round report…';
  }

  let n=0;
  for(const s of done){
    n+=1;
    const full=await fetch(api('/api/sessions/'+s.id)).then(r=>r.json());
    const rep=full.report;
    const r=s.receipt||{};
    const href=`/round/${rid}/s/${s.id}?key=${KEY}`;
    const who=r.who?`<div class="small muted" style="margin-top:4px">${esc(r.who)}</div>`:'';
    let body='';
    if(!rep) body=`<div class="small muted" style="margin-top:10px">Writing the report…</div>`;
    else {
      const takes=(rep.takeaways&&rep.takeaways.length)?`<ol class="report-index-takes">${rep.takeaways.slice(0,3).map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:'';
      const change=rep.change_if_true?`<div class="small" style="margin-top:10px"><span class="muted">If true, change</span><div style="margin-top:4px">${esc(rep.change_if_true)}</div></div>`:'';
      body=takes+change;
      if(!takes&&!change){
        const answered=(rep.items||[]).filter(it=>it.status==='answered').length;
        body=`<div class="small muted" style="margin-top:10px">${answered} of ${(rep.items||[]).length} questions answered</div>`;
      }
    }
    const card=document.createElement('a');
    card.href=href;card.className='card sess-line report-index-card';
    card.innerHTML=`<div class="row" style="align-items:flex-start">
  <div style="flex:1;min-width:0">
    <div class="sess-title">Session ${n} · ${esc(r.handle||s.handle||'someone')}</div>
    <div class="small muted">${r.minutes??'-'} min</div>${who}${body}
  </div>
  <span class="small sess-open">Open</span>
</div>`;
    out.appendChild(card);
  }
}
load();
</script>
</main></body></html>
