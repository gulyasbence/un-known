<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>(un)known</title><link rel="stylesheet" href="/static/style.css"><link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><path d="M4 16s5-7 12-7 12 7 12 7-5 7-12 7S4 16 4 16z" fill="none" stroke="%23111" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="3.5" fill="none" stroke="%23111" stroke-width="2"/><line x1="6" y1="6" x2="26" y2="26" stroke="%23111" stroke-width="2" stroke-linecap="round"/></svg>' media="(prefers-color-scheme: light)"><link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><path d="M4 16s5-7 12-7 12 7 12 7-5 7-12 7S4 16 4 16z" fill="none" stroke="%23ecece6" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="3.5" fill="none" stroke="%23ecece6" stroke-width="2"/><line x1="6" y1="6" x2="26" y2="26" stroke="%23ecece6" stroke-width="2" stroke-linecap="round"/></svg>' media="(prefers-color-scheme: dark)"><script src="/static/theme.js"></script>
<style>
  html,body{height:100%;margin:0}
  body.in-chat{height:100dvh;overflow:hidden;background:var(--bg)}
  body.in-chat #shell{max-width:560px;margin:0 auto;height:100dvh;padding:0;display:flex;flex-direction:column}
  #chat.chat-shell{flex:1;min-height:0;width:100%;display:flex;flex-direction:column}
  .chat-top{flex:0 0 auto;padding:14px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
  .chat-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
  .chat-project{font-size:14px;font-weight:500;color:var(--ink);letter-spacing:-0.02em;line-height:1.3;min-width:0}
  .chat-brand{flex:none;display:flex;align-items:baseline;gap:6px;font-size:12px;letter-spacing:-0.01em}
  .chat-brand a{color:var(--muted);text-decoration:none}
  .chat-brand a:hover{color:var(--text)}
  .chat-brand-by{opacity:.6}
  .chat-bar-track{height:2px;background:var(--line);overflow:hidden;border-radius:0}
  .chat-bar{height:2px;width:0;background:var(--ink);transition:width .3s}
  #msgs.chat{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin:0;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}
  .msg-wrap{display:flex;flex-direction:column;gap:4px;max-width:85%}
  .msg-wrap.agent{align-self:flex-start}
  .msg-wrap.user{align-self:flex-end;align-items:flex-end}
  .msg-tag{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
  .msg-wrap .msg{max-width:100%}
  .msg.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
  .msg.thinking .wait-dots{width:12px;height:12px;border:1.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:wait-spin .75s linear infinite;flex:none}
  #done.card{border:0;padding:8px 0;background:transparent;color:var(--muted);font-size:13px;line-height:1.55}
  #msgs.chat::before{content:"";flex:1 1 auto;min-height:0}
  .chat-bottom{flex:0 0 auto;width:100%;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  #inrow{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:flex-end;gap:8px;width:100%}
  #inrow #in{flex:1 1 auto;min-width:0;width:auto;min-height:40px;max-height:120px}
  #inrow #send{flex:0 0 auto}
  #done{margin:0}

  .deal{max-width:560px;margin:0 auto;padding:48px 20px 80px}
  .deal-brand{display:flex;justify-content:flex-end;margin:0 0 12px}
  .deal-card{border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px}
  .deal-card h1{font-size:20px;margin:0 0 10px;color:var(--ink);line-height:1.3}
  .deal-meta{margin:0 0 6px;color:var(--muted);font-size:13px;line-height:1.55}
  .deal-note{margin:0 0 28px;color:var(--muted);font-size:12.5px;line-height:1.55}
  .deal-q{margin:0 0 22px;padding-top:22px;border-top:1px solid var(--line)}
  .deal-q:first-of-type{border-top:0;padding-top:0}
  .deal-q-label{margin:0 0 12px;font-size:13px;line-height:1.55;color:var(--text)}
  .deal-q-hint{color:var(--muted);font-size:12px}
  .deal-opts{display:flex;flex-wrap:wrap;gap:8px}
  .deal-opts button{
    font:inherit;font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;
    padding:8px 12px;border-radius:var(--radius);border:1px solid var(--line);
    background:transparent;color:var(--text);cursor:pointer;
  }
  .deal-opts button:hover{border-color:var(--muted)}
  .deal-opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
  .deal-start{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
  .deal-start #handle{flex:1 1 180px;min-width:0;margin:0}
  .deal-start #start{flex:0 0 auto}
</style>
</head>
<body><button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
<main id="shell" class="session-shell">
<div id="deal"></div>
<div id="chat" class="chat-shell" style="display:none">
  <div class="chat-top">
    <div class="chat-head">
      <div class="chat-project" id="chat-project"></div>
      <span class="brandmark"><a class="brand" href="/">(un)known</a><span class="by">powered by <a href="https://www.orbio.so/" target="_blank" rel="noopener">Orbio</a></span></span>
    </div>
    <div class="chat-bar-track"><div id="bar" class="chat-bar"></div></div>
  </div>
  <div class="chat" id="msgs"></div>
  <div class="chat-bottom">
    <div id="inrow"><textarea id="in" rows="1" placeholder="type your answer" aria-label="Your answer"></textarea><button id="send">Send</button></div>
    <div id="done" style="display:none" class="card receipt"></div>
  </div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);const tok=location.pathname.split('/')[2];let S=null;
async function load(){S=await fetch('/api/s/'+tok).then(r=>r.json());if(S.error){document.querySelector('main').innerHTML='<h1>(un)known</h1><p class="sub">This session link is expired or invalid.</p><p class="small muted" style="margin-top:20px"><a href="/">&#8592; start over</a></p>';return}if(S.state.done||S.transcript.length>1)start();else deal()}
let SCREEN=[];
// The brief always makes the second screener question multi-select; the wording may or may not say so.
function isMulti(q,i){return i===1||/all that apply|select all|tap all/i.test(q.q||'')}
function cleanQ(q){return String(q.q||'').replace(/\s*\((?:tap |select )?all that apply\)\s*/gi,'').trim()}
function deal(){
  document.title=(S.project?S.project+' · ':'')+'(un)known';
  const qs=(S.screener||[]).map((q,i)=>{
    const multi=isMulti(q,i);
    const label=cleanQ(q);
    const hint=multi?' <span class="deal-q-hint">all that apply</span>':'';
    const opts=(q.options||[]).map(o=>`<button type="button" data-o="${o.replace(/"/g,'&quot;')}" aria-pressed="false">${o}</button>`).join('');
    return `<div class="deal-q"><div class="deal-q-label">${label}${hint}</div><div class="deal-opts row" data-i="${i}" data-multi="${multi?1:0}">${opts}</div></div>`;
  }).join('');
  $('#deal').innerHTML=`<div class="deal"><div class="deal-brand"><span class="brandmark"><a class="brand" href="/">(un)known</a><span class="by">powered by <a href="https://www.orbio.so/" target="_blank" rel="noopener">Orbio</a></span></span></div><div class="deal-card">
  <h1>${S.project} wants to hear from you</h1>
  <p class="deal-meta">${S.n} questions · about ${S.minutes} minutes</p>
  <p class="deal-note">No signup. Answers go to the founder with your handle.</p>
  ${qs}
  <div class="deal-start">
    <input id="handle" placeholder="your handle (optional)" aria-label="Your handle">
    <button id="start">Start</button>
  </div>
</div></div>`;
  document.querySelectorAll('#deal .deal-opts').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const multi=row.dataset.multi==='1';
    if(!multi){row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'))}
    const on=b.getAttribute('aria-pressed')==='true';
    if(multi&&on) b.setAttribute('aria-pressed','false');
    else b.setAttribute('aria-pressed','true');
    const picked=[...row.querySelectorAll('button')].filter(x=>x.getAttribute('aria-pressed')==='true').map(x=>x.dataset.o);
    SCREEN[+row.dataset.i]=picked.join(', ');
  }));
  $('#start').onclick=()=>{
    const need=(S.screener||[]).length;
    if(SCREEN.filter(Boolean).length<need){
      $('#start').textContent='Pick answers above';
      setTimeout(()=>$('#start').textContent='Start',1500);
      return;
    }
    S.handle=$('#handle').value.trim()||null;
    start();
  };
}
function start(){$('#deal').innerHTML='';document.body.classList.add('in-chat');const c=$('#chat');c.style.display='flex';c.style.flexDirection='column';$('#chat-project').textContent=S.project||'Chat';document.title=(S.project?S.project+' · ':'')+'(un)known';render();$('#in').focus()}
function progressLabel(){
  if(S.state.done)return 'Done';
  const item=S.state.item;
  if(item==null||item<0)return `Opening · ${S.n} questions`;
  return `Question ${Math.min(item+1,S.n)} of ${S.n}`;
}
function progressPct(){
  if(S.state.done)return 100;
  const item=S.state.item;
  if(item==null||item<0)return 8;
  return Math.min(96,Math.round(100*(item+0.5)/S.n));
}
function render(opts){
  const keepThink=opts&&opts.keepThinking;
  const m=$('#msgs');
  const thinking=m.querySelector('.msg-wrap.thinking');
  m.innerHTML='';
  S.transcript.forEach(t=>{
    const wrap=document.createElement('div');
    wrap.className='msg-wrap '+t.role;
    const tag=document.createElement('div');
    tag.className='msg-tag';
    tag.textContent=t.role==='agent'?'Interviewer':'You';
    const d=document.createElement('div');
    d.className='msg '+t.role;
    d.textContent=t.text;
    wrap.append(tag,d);
    m.appendChild(wrap);
  });
  if(keepThink&&thinking) m.appendChild(thinking);
  $('#bar').style.width=progressPct()+'%';
  if(S.state.done){
    $('#inrow').style.display='none';
    $('#done').style.display='block';
    $('#done').textContent='Thanks, everything is saved. You can close this.';
  }
  requestAnimationFrame(()=>{m.scrollTop=m.scrollHeight});
}
function showThinking(){
  const m=$('#msgs');
  if(m.querySelector('.msg-wrap.thinking')) return;
  const wrap=document.createElement('div');
  wrap.className='msg-wrap agent thinking';
  wrap.innerHTML=`<div class="msg-tag">Interviewer</div><div class="msg thinking"><span class="wait-dots" aria-hidden="true"></span>Thinking…</div>`;
  m.appendChild(wrap);
  requestAnimationFrame(()=>{m.scrollTop=m.scrollHeight});
}
function hideThinking(){
  const t=$('#msgs').querySelector('.msg-wrap.thinking');
  if(t) t.remove();
}
function tooShort(v){const words=v.split(/\s+/).filter(Boolean);if(words.length<3)return true;if(/^(.)\1{4,}$/.test(v.replace(/\s/g,'')))return true;if(new Set(words).size===1&&words.length>2)return true;return false}
const inp=$('#in');
async function send(){
  const v=$('#in').value.trim();if(!v)return;
  if(tooShort(v)){inp.style.borderColor='var(--warn)';inp.setAttribute('placeholder','Say a bit more. A sentence or two helps');setTimeout(()=>{inp.style.borderColor='';inp.setAttribute('placeholder','type your answer')},2000);return}
  $('#in').value='';inp.style.height='auto';$('#send').disabled=true;inp.disabled=true;
  S.transcript.push({role:'user',text:v});render();showThinking();
  try{
    const r=await fetch('/api/s/'+tok+'/answer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:v,handle:S.handle,screener:SCREEN})}).then(r=>r.json());
    S.state=r.state;S.transcript=r.transcript;S.receipt=r.receipt;
  }finally{
    hideThinking();$('#send').disabled=false;inp.disabled=false;render();
    if(!S.state.done)$('#in').focus();
  }
}
$('#send').onclick=send;
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){e.preventDefault();send()}};
inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'};
load();
</script>
</body></html>
